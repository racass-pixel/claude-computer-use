name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt check
        shell: pwsh
        run: |
          $out = gofmt -l .
          if ($out) { Write-Output $out; exit 1 }
      - name: cross-compile check (linux)
        run: go build ./...
        env:
          GOOS: linux
          CGO_ENABLED: "0"
      - run: go vet -unsafeptr=false ./...
      - run: go test ./...
      - run: go build -trimpath -ldflags "-s -w" -o bin/cu.exe ./cmd/cu
        env:
          CGO_ENABLED: "0"
