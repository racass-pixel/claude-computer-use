name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -ldflags "-s -w" -o bin/cu.exe ./cmd/cu
        env:
          CGO_ENABLED: "0"
